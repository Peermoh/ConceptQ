.item { cursor: pointer; }
.item:focus { outline: none; }
.item:focus-visible .hit { stroke: #FFE07A; stroke-width: 4; }

.plot { opacity: .55; }

#toast { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(30px); z-index: 4; opacity: 0; transition: .4s; background: #FFB547; color: var(--ink); font-weight: 800; padding: 12px 18px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,.35); max-width: calc(100% - 32px); text-align: center; }

      g += '<rect y="' + GY + '" width="' + W + '" height="14" fill="#CDBBA4"/><rect y="' + (GY + 14) + '" width="' + W + '" height="74" fill="#4A4458"/><rect y="' + (GY + 88) + '" width="' + W + '" height="' + (H - GY - 88) + '" fill="#CDBBA4"/>';
      if (weather === 'snow') g += '<rect y="' + (GY - 4) + '" width="' + W + '" height="8" rx="4" fill="#fff" opacity=".9"/>';
      if (v > 4) { // lines lesson: road markings along the whole street, and a zebra crossing
        for (var d = 20; d < W; d += 60) g += '<rect x="' + d + '" y="' + (GY + 49) + '" width="32" height="5" rx="2" fill="#fff"/>';
        var zx = 80 + 4 * 140 - 40; for (var z = 0; z < 6; z++) g += '<rect x="' + zx + '" y="' + (GY + 18 + z * 12) + '" width="80" height="6" fill="#fff" opacity=".9"/>';
      }
      if (v > 5) { // adding and taking away: festival lights across the street
        g += '<path d="M0 40 ' + Array.apply(null, Array(Math.ceil(W / 140) + 1)).map(function (x, i) { return 'Q' + (i * 140 + 70) + ' 78 ' + (i * 140 + 140) + ' 40'; }).join(' ') + '" fill="none" stroke="' + K + '" stroke-width="1.5" opacity=".7"/>';
        for (var b = 0; b < W / 28; b++) { var bx = b * 28 + 14, t = (bx % 140) / 140, by = 40 + 76 * t * (1 - t); g += '<circle cx="' + bx + '" cy="' + (by + 6) + '" r="5" fill="' + ['#FFE07A', '#FF8FC7', '#7CF5C8', '#9FE3FF'][b % 4] + '" class="' + (b % 3 ? '' : 'blink') + '"/>'; }
      }
    } else {
      g += '<rect width="' + W + '" height="' + H + '" fill="' + (time === 'night' ? '#3A2A4A' : '#F4D9B8') + '"/>';
      for (var p = 0; p < W; p += 48) g += '<rect x="' + p + '" y="0" width="24" height="' + GY + '" fill="' + (time === 'night' ? '#43314F' : '#F0CFA8') + '"/>';
      g += '<rect y="' + (GY - 10) + '" width="' + W + '" height="10" fill="#B57A4E"/><rect y="' + GY + '" width="' + W + '" height="' + (H - GY) + '" fill="' + (time === 'night' ? '#5A3E2E' : '#C99A6A') + '"/>';
      for (var f = 0; f < W; f += 70) g += '<path d="M' + f + ' ' + GY + ' V' + H + '" stroke="rgba(0,0,0,.12)" stroke-width="2"/>';
      for (var l = 0; l < Math.ceil(W / 280); l++) g += '<g><path d="M' + (l * 280 + 140) + ' 0 v30" stroke="' + K + '" stroke-width="2"/><path d="M' + (l * 280 + 122) + ' 30 h36 l-6 14 h-24 z" fill="#FFC861"' + S + '/>' + (time === 'night' || time === 'sunset' ? '<circle cx="' + (l * 280 + 140) + '" cy="60" r="46" fill="#FFE07A" opacity=".14"/>' : '') + '</g>';
    }
    return g;
  }
  function render() {
    var g = backdrop(), x0 = 80;
    C.items.forEach(function (it, i) {
      var x = x0 + i * 140, y = GY;
      if (i < v) {
        var hidden = i === build ? ' style="opacity:0"' : '';
        g += '<g class="item" data-i="' + i + '" tabindex="0" role="button" aria-label="' + esc(it.part) + ', lesson ' + (i + 1) + '" transform="translate(' + x + ' ' + y + ')"><g class="body"' + hidden + '>' + DRAW[course][i]() + '</g><rect class="hit" x="-62" y="-270" width="124" height="290" rx="10"/></g>';
      } else {
        g += '<g class="plot" transform="translate(' + x + ' ' + y + ')"><rect x="-50" y="-110" width="100" height="110" rx="10" fill="none" stroke="#FFF6EC" stroke-width="2.5" stroke-dasharray="7 6"/>' + txt(0, -64, '🔒', 20) + txt(0, -36, 'Lesson ' + (i + 1), 12, '#FFF6EC') + '</g>';
      }
    });
    var box = document.getElementById('street'), h = box.clientHeight || 600, scale = h / H;
    box.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + Math.round(W * scale) + '" height="' + h + '" role="img" aria-label="' + esc(C.place + ', ' + C.street) + '">' + g + '</svg>';
    box.querySelectorAll('.item').forEach(function (el) {
      el.addEventListener('click', function () { openCard(+el.getAttribute('data-i')); });
      el.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openCard(+el.getAttribute('data-i')); } });
    });
    return scale;
  }
  function scrollTo(i, smooth) {
    var box = document.getElementById('street'), scale = (box.clientHeight || 600) / H, x = (80 + i * 140) * scale - box.clientWidth / 2;
    box.scrollTo({ left: Math.max(0, x), behavior: smooth && !still ? 'smooth' : 'auto' });
  }
  function openCard(i) {
    var it = C.items[i];
    document.getElementById('shE').textContent = C.street + ' · lesson ' + (i + 1);
    document.getElementById('shT').textContent = it.title.charAt(0).toUpperCase() + it.title.slice(1);
    document.getElementById('shV').textContent = it.vis;
    document.getElementById('shP').textContent = 'You built the ' + it.part + '. ' + it.example;
    document.getElementById('sheet').classList.add('on'); document.getElementById('hint').style.opacity = 0;
    document.getElementById('shX').focus({ preventScroll: true });
  }
  document.getElementById('shX').addEventListener('click', function () { document.getElementById('sheet').classList.remove('on'); });
  function toast(t) { var el = document.getElementById('toast'); el.textContent = t; el.classList.add('on'); setTimeout(function () { el.classList.remove('on'); }, 3200); }
  function buildMoment(i) {
    scrollTo(i, false);
    // the learner builds it first: the new build is cut into puzzle pieces, then it pops up with sparkles
    var body0 = document.querySelector('.item[data-i="' + i + '"] .body');
    if (window.CQPuzzle && body0 && !buildMoment.puzzled) {
      buildMoment.puzzled = true; body0.style.opacity = '';
      setTimeout(function () { // look it up again: a resize may have redrawn the street meanwhile
        var el = document.querySelector('.item[data-i="' + i + '"] .body'); if (el) el.style.opacity = '';
        CQPuzzle.start({ svg: document.querySelector('#street svg'), parts: [el], title: 'Build the ' + C.items[i].part + '!', onDone: function () { var e2 = document.querySelector('.item[data-i="' + i + '"] .body'); if (e2) e2.style.opacity = 0; buildMoment(i); } }); }, 300);
      return;
    }
    setTimeout(function () {
      var el = document.querySelector('.item[data-i="' + i + '"] .body'); if (!el) return;
      el.style.opacity = ''; el.classList.add('pop');
      var it = document.querySelector('.item[data-i="' + i + '"]'), sp = '';
      for (var k = 0; k < 8; k++) sp += '<text class="spark" style="animation-delay:' + (0.3 + k * 0.08) + 's" x="' + (Math.cos(k / 8 * 6.28) * 60) + '" y="' + (-120 + Math.sin(k / 8 * 6.28) * 60) + '" text-anchor="middle" font-size="18">✨</text>';
      it.insertAdjacentHTML('beforeend', sp);
      var pt = C.items[i].part; toast((course === 'maths' ? 'Market Street' : 'The Picture-book Corner') + ' has ' + (/s$/.test(pt) && !/'s /.test(pt) ? 'new ' : 'a new ') + pt + '!');
    }, still ? 0 : 500);
  }
  render();
  if (build >= 0) buildMoment(build); else scrollTo(Math.max(0, v - 1), false);
  var rt; window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(function () { var sl = document.getElementById('street').scrollLeft; render(); document.getElementById('street').scrollLeft = sl; startFx(); }, 150); });
  document.getElementById('street').addEventListener('scroll', function () { document.getElementById('hint').style.opacity = 0; }, { passive: true });
  window.addEventListener('storage', function (e) { if (e.key === 'cq-scene') { readScene(); render(); startFx(); } });

  // ---- weather: rain, snow and blowing leaves on a canvas (outdoors only; the library shows it in the window) ----
  var fx = { parts: [], on: false, last: 0 };
  function spawn(kind, w, h, any) {
    var p = { kind: kind, x: Math.random() * w, y: any ? Math.random() * h : -10, s: Math.random() };
    if (kind === 'rain') { p.vy = 520 + p.s * 260; p.vx = -90; p.len = 10 + p.s * 10; }
    if (kind === 'snow') { p.vy = 22 + p.s * 30; p.r = 1.2 + p.s * 2.2; p.ph = Math.random() * 6; }
    if (kind === 'leaf') { p.x = any ? Math.random() * w : -20; p.vx = 160 + p.s * 220; p.vy = 20 + p.s * 30; p.r = 3 + p.s * 3; p.ph = Math.random() * 6; }
    return p;
  }
  function startFx() {
    var c = document.getElementById('fx'), w = c.clientWidth, h = c.clientHeight; c.width = w * (devicePixelRatio || 1); c.height = h * (devicePixelRatio || 1);
    var kinds = course === 'english' ? [] : ({ rain: [['rain', 110]], storm: [['rain', 180], ['leaf', 10]], snow: [['snow', 90]], wind: [['leaf', 34]] }[weather] || []);
    fx.parts = []; kinds.forEach(function (k) { for (var i = 0; i < k[1]; i++) fx.parts.push(spawn(k[0], w, h, true)); });
    var ctx = c.getContext('2d'); ctx.setTransform(devicePixelRatio || 1, 0, 0, devicePixelRatio || 1, 0, 0); ctx.clearRect(0, 0, w, h);
    if (!still && fx.parts.length && !fx.on) { fx.on = true; fx.last = performance.now(); requestAnimationFrame(frame); }
  }
  function frame(now) {
    var c = document.getElementById('fx'), ctx = c.getContext('2d'), w = c.clientWidth, h = c.clientHeight, dt = Math.min(0.05, (now - fx.last) / 1000); fx.last = now;
    ctx.clearRect(0, 0, w, h);
    if (!fx.parts.length) { fx.on = false; return; }
    fx.parts.forEach(function (p, i) {
      p.x += (p.vx || 0) * dt + (p.kind === 'snow' ? Math.sin(now / 900 + p.ph) * 0.3 : 0); p.y += p.vy * dt;
      if (p.kind === 'rain') { ctx.strokeStyle = 'rgba(200,225,255,.55)'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.len * 0.17, p.y + p.len); ctx.stroke(); }
      else if (p.kind === 'snow') { ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.3); ctx.fill(); }
      else { ctx.fillStyle = 'rgba(230,160,70,.85)'; ctx.beginPath(); ctx.ellipse(p.x, p.y + Math.sin(now / 300 + p.ph) * 6, p.r * 1.6, p.r, now / 400 + p.ph, 0, 6.3); ctx.fill(); }
      if (p.y > h + 20 || p.x > w + 30) fx.parts[i] = spawn(p.kind, w, h, false);
    });
    requestAnimationFrame(frame);
  }
  startFx();
})();
</script>
