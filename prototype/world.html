* { box-sizing: border-box; }

#street { position: absolute; inset: 0; overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; -webkit-overflow-scrolling: touch; }

#fx { position: absolute; inset: 0; pointer-events: none; z-index: 2; width: 100%; height: 100%; }
.item { cursor: pointer; }
.item:focus { outline: none; }
.item:focus-visible .hit { stroke: #FFE07A; stroke-width: 4; }
.hit { fill: transparent; stroke: none; }
.plot { opacity: .55; }
.pop { animation: pop 1.1s cubic-bezier(.2,1.4,.4,1) both; transform-box: fill-box; transform-origin: 50% 100%; }
@keyframes pop { 0% { transform: scale(0.1) translateY(40px); opacity: 0; } 60% { opacity: 1; } 100% { transform: none; opacity: 1; } }
.spark { animation: spark 1.4s ease-out both; transform-box: fill-box; transform-origin: center; }
@keyframes spark { 0% { opacity: 0; transform: scale(.2); } 30% { opacity: 1; } 100% { opacity: 0; transform: scale(1.6) translateY(-30px); } }
.sway { animation: sway 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 0; }
@keyframes sway { 50% { transform: rotate(2deg); } }
.spin { animation: wspin 18s linear infinite; }
@keyframes wspin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
.blink { animation: blink 1.6s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .35; } }
#toast { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(30px); z-index: 4; opacity: 0; transition: .4s; background: #FFB547; color: var(--ink); font-weight: 800; padding: 12px 18px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,.35); max-width: calc(100% - 32px); text-align: center; }

      else if (p.kind === 'snow') { ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.3); ctx.fill(); }
      else { ctx.fillStyle = 'rgba(230,160,70,.85)'; ctx.beginPath(); ctx.ellipse(p.x, p.y + Math.sin(now / 300 + p.ph) * 6, p.r * 1.6, p.r, now / 400 + p.ph, 0, 6.3); ctx.fill(); }
      if (p.y > h + 20 || p.x > w + 30) fx.parts[i] = spawn(p.kind, w, h, false);
    });
    requestAnimationFrame(frame);
  }
  startFx();
})();
