<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>html,body{margin:0;height:100%;background:#1A0B1F}[hidden]{display:none!important}</style>
<title>ConceptQ House 2.5D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Paytone+One&family=Nunito:wght@600;700;800;900&family=JetBrains+Mono:wght@700&display=swap">
<style>
/* Layout: one phone-sized app. House view (isometric floor) -> tap a room -> room view with drag-to-place items. Single dark world. */
:root {
  --bg: #2A1330; --deep: #1F0E24; --panel: #3A1F41; --line: #4E3058;
  --cream: #FFF1E2; --muted: #D9BFD2; --amber: #FFB547; --amber-deep: #D98A1F;
  --mint: #7CF5C8; --mint-deep: #1E9E6E; --coral: #FF7A6B;
  --display: 'Paytone One', 'Arial Rounded MT Bold', system-ui, sans-serif;
  --body: 'Nunito', system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--deep); color: var(--cream); font-family: var(--body); font-weight: 700; }
.stage { height: 100%; display: flex; justify-content: center; align-items: center; }
.app { -webkit-user-select: none; user-select: none; position: relative; width: 100%; max-width: 420px; height: 100%; max-height: 900px; background: var(--bg); overflow: hidden; display: flex; flex-direction: column; }
@media (min-width: 520px) { .stage { padding-block: 20px; } .app { border-radius: 34px; box-shadow: 0 30px 80px rgba(0,0,0,0.55); } }
.pad { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; border-radius: 12px; }
.view { position: absolute; inset: 0; display: flex; flex-direction: column; transition: opacity 0.35s ease, transform 0.35s ease; }
.view.out { opacity: 0; transform: scale(0.92); pointer-events: none; }
.view.out.zoom { transform: scale(1.12); }
header { display: flex; justify-content: space-between; align-items: center; padding-block: 16px 8px; gap: 10px; }
.title { display: flex; flex-direction: column; line-height: 1.1; min-width: 0; }
.title b { font-family: var(--display); font-weight: 400; font-size: 24px; }
.title span { font-size: 13px; color: var(--muted); }
.chip { min-height: 40px; padding: 0 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); font-size: 13px; display: flex; align-items: center; gap: 6px; }
.chip.go { background: var(--mint); color: #08281C; border-color: var(--mint); }
.scene { position: relative; flex: 1; min-height: 0; }
.scene > svg { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.scene > svg.nibb { inset: auto; width: 74px; height: 68px; pointer-events: none; }
.room-hit { cursor: pointer; transition: fill-opacity 0.2s ease; fill-opacity: 0; }
.spot:focus { outline: none; }
.spot:focus-visible { stroke: #2A1330; stroke-width: 3.5; stroke-dasharray: none; fill-opacity: 0.55; }
.placed:focus { outline: none; }
.placed:focus-visible { filter: drop-shadow(0 0 3px #FFB547) drop-shadow(0 0 6px #FFB547); }
.room-hit:hover, .room-hit:focus { fill-opacity: 0.22; outline: none; }
.bubble { position: absolute; background: var(--cream); color: #2A1330; border-radius: 16px; padding: 9px 12px; font-size: 14px; line-height: 1.3; max-width: 210px; box-shadow: 0 8px 20px rgba(0,0,0,0.3); transition: transform 0.2s ease; }
.chip.turn { min-height: 34px; padding: 0 12px; background: var(--mint); color: #08281C; border-color: var(--mint); font-weight: 800; }
#roomBubble { pointer-events: none; }
.card-sheet { position: absolute; left: 12px; right: 12px; bottom: 10px; z-index: 6; background: #FFF6EA; color: #2A1330; border-radius: 22px; padding: 14px 16px 16px; box-shadow: 0 14px 40px rgba(0,0,0,0.45); display: flex; flex-direction: column; gap: 8px; animation: pop 0.25s ease-out; }
.card-sheet.top { top: 8px; bottom: auto; }
.ic-head { display: flex; justify-content: space-between; align-items: center; }
.ic-badge { font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: .04em; color: #8E3D2F; background: #FFE2C9; border-radius: 999px; padding: 3px 9px; }
.ic-x { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: #F1E2D2; color: #2A1330; }
.ic-title { font-family: var(--display); font-weight: 400; font-size: 22px; }
.ic-idea { margin: 0; font-size: 14px; line-height: 1.35; color: #5B3B52; }
.ic-code { margin: 0; background: #2A1330; color: #FFF1E2; border-radius: 14px; padding: 10px 12px; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13.5px; line-height: 1.55; white-space: pre-wrap; }
.ic-code .k { color: #FFB547; } .ic-code .st { color: #7CF5C8; } .ic-code .o { color: #C3A6FF; } .ic-code .c { color: #9C86A0; } .ic-code .new { background: rgba(124,245,200,0.18); border-radius: 4px; }
.ic-play { display: flex; gap: 6px; flex-wrap: wrap; }
.ic-play:empty { display: none; }
.book { min-height: 40px; padding: 0 10px; border-radius: 8px; font-size: 13px; font-weight: 800; color: #2A1330; border: 2px solid rgba(0,0,0,0.15); }
.book[aria-pressed="true"] { outline: 3px solid #2A1330; outline-offset: 1px; }
.ic-actions { display: flex; gap: 8px; }
.ic-btn { flex: 1; min-height: 46px; border-radius: 14px; font-size: 15px; font-weight: 900; background: #F1E2D2; color: #2A1330; }
.ic-btn.try { background: var(--amber); box-shadow: inset 0 -4px 0 var(--amber-deep); }
.ic-btn.try[hidden] { display: none; }
/* build moment: a part arrives on the land */
#houseSvg [data-part] { transform-box: fill-box; transform-origin: 50% 100%; }
.build-drop { animation: buildDrop 0.9s cubic-bezier(.3,1.45,.5,1) 0.5s both; }
.build-rise { animation: buildRise 1.4s cubic-bezier(.25,1.2,.4,1) 0.5s both; }
@keyframes buildDrop { from { transform: translateY(-140px); opacity: 0; } 30% { opacity: 1; } to { transform: none; opacity: 1; } }
@keyframes buildRise { from { transform: scaleY(0.03); opacity: .4; } to { transform: none; opacity: 1; } }
.puff { transform-box: fill-box; transform-origin: center; animation: puff 1s ease-out both; }
@keyframes puff { from { transform: scale(.3); opacity: .9; } to { transform: translate(var(--dx), -14px) scale(1.7); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .build-drop, .build-rise, .puff { animation: none; } }
.bubble.pop { animation: pop 0.3s ease-out; }
@keyframes pop { from { transform: scale(0.85); } to { transform: scale(1); } }
.nibb { position: absolute; width: 74px; height: 68px; animation: bob 3s ease-in-out infinite; }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.card { margin: 0 16px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.card .eyebrow { font-size: 12px; letter-spacing: 1.2px; color: var(--amber); text-transform: uppercase; }
.card p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.35; }
.tray { position: relative; z-index: 3; background: var(--panel); border-top-left-radius: 24px; border-top-right-radius: 24px; padding: 12px 0 calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; }
.tray-head { display: flex; justify-content: space-between; align-items: baseline; }
.tray-head b { font-family: var(--display); font-weight: 400; font-size: 17px; }
.tray-head span { font-size: 12px; color: var(--muted); }
.items { display: grid; grid-auto-flow: column; grid-auto-columns: 72px; gap: 10px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.items::-webkit-scrollbar { display: none; }
button.item { background: none; border: 0; padding: 0; font: inherit; color: var(--muted); }
.item { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); touch-action: pan-x; user-select: none; -webkit-user-select: none; }
.item .tile { width: 64px; height: 64px; border-radius: 18px; background: var(--bg); border: 1.5px solid var(--line); display: grid; place-items: center; position: relative; }
.item.can .tile { border-color: var(--amber); cursor: grab; }
.item.can { color: var(--cream); }
.item.used .tile, .item.locked .tile { opacity: 0.45; }
.item .count { position: absolute; top: -6px; right: -6px; min-width: 20px; height: 20px; border-radius: 10px; background: var(--amber); color: #2A1A05; font-size: 11px; display: grid; place-items: center; padding: 0 5px; }
.item .count.lock { background: var(--line); color: var(--muted); }
.ghost { position: fixed; z-index: 50; pointer-events: none; width: 70px; height: 70px; margin: -60px 0 0 -35px; display: grid; place-items: center; filter: drop-shadow(0 10px 14px rgba(0,0,0,0.45)); transform: rotate(-6deg); }
.toast { position: absolute; left: 50%; bottom: 168px; transform: translateX(-50%); background: #14684A; color: #fff; border-radius: 999px; padding: 8px 14px; font-size: 13px; white-space: nowrap; opacity: 0; transition: opacity 0.25s ease; pointer-events: none; }
.toast.on { opacity: 1; }

/* ---------- world around the house ---------- */
#houseView .scene { position: absolute; inset: 0; }
#houseView header, #houseView .card, #roomView header { position: relative; z-index: 2; }
#roomView header { background: var(--bg); box-shadow: 0 6px 16px rgba(0,0,0,0.25); }
#houseView .card { margin-top: auto; background: rgba(42, 19, 48, 0.9); backdrop-filter: blur(6px); }
.glass { background: rgba(31, 14, 36, 0.72); border-radius: 16px; padding: 6px 12px; backdrop-filter: blur(6px); }
#houseSvg, #roomSvg { overflow: visible; }
.cloud { animation: cloudCross linear infinite; }
@keyframes cloudCross { from { transform: translateX(-520px); } to { transform: translateX(520px); } }
.flyby { animation: flyby linear infinite; }
@keyframes flyby { from { transform: translateX(-120px); } to { transform: translateX(520px); } }
.flap { transform-box: fill-box; transform-origin: center; animation: flap 0.42s ease-in-out infinite alternate; }
@keyframes flap { from { transform: scaleY(1); } to { transform: scaleY(-0.5); } }
.sway { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 4s ease-in-out infinite alternate; }
@keyframes sway { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
.duck { animation: duck 6s ease-in-out infinite alternate; }
@keyframes duck { 0% { transform: translate(-14px, 2px); } 50% { transform: translate(0, -2px); } 100% { transform: translate(14px, 2px); } }
.tumble-move { animation: tumbleMove 14s linear infinite; }
@keyframes tumbleMove { from { transform: translateX(-80px); } to { transform: translateX(480px); } }
.tumble { transform-box: fill-box; transform-origin: center; animation: tumble 1.2s linear infinite; }
@keyframes tumble { to { transform: rotate(360deg); } }
.bfwing { transform-box: fill-box; transform-origin: 100% 50%; animation: bfwing 0.22s ease-in-out infinite alternate; }
.bfwing.r { transform-origin: 0% 50%; }
@keyframes bfwing { from { transform: scaleX(1); } to { transform: scaleX(0.25); } }

.enter-hit { cursor: pointer; }
.enter-hit:focus { outline: none; fill-opacity: 0.12; }
.smoke { animation: smoke 3.3s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes smoke { 0% { transform: translate(0, 0) scale(0.6); opacity: 0.85; } 100% { transform: translate(14px, -46px) scale(1.8); opacity: 0; } }
#houseSvg.zoomin { animation: zin 0.26s ease-in forwards; transform-origin: 30% 70%; }
#houseSvg.zoomout { animation: zout 0.26s ease-in forwards; transform-origin: 50% 50%; }
#houseSvg.fadein { animation: fin 0.3s ease-out; }
@keyframes zin { to { transform: scale(1.35); opacity: 0; } }
@keyframes zout { to { transform: scale(0.85); opacity: 0; } }
@keyframes fin { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }

#houseView.inside { background: radial-gradient(ellipse at 50% 42%, #4A2552 0%, #2A1330 55%, #1A0B1F 100%); }

.item .from { font-size: 9.5px; color: #B49AAE; margin-top: -3px; text-align: center; line-height: 1.1; max-width: 72px; }
.item.selected .tile { border-color: var(--mint); box-shadow: 0 0 0 3px rgba(124, 245, 200, 0.35); transform: translateY(-4px); }
.item .tile { transition: transform 0.15s ease, box-shadow 0.15s ease; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<div class="stage"><div class="app" id="app">

  <section class="view" id="houseView" aria-label="House">
    <header class="pad">
      <div style="display: flex; gap: 8px; align-items: center; min-width: 0"><button class="chip" id="outBtn" hidden aria-label="Back outside"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>Outside</button><div class="title glass"><b>My House</b><span id="houseSub">Ground floor · outside</span></div></div>
      <div style="display: flex; gap: 6px"><button class="chip" id="worldBtn" aria-label="Change the world around your house">Spring</button><button class="chip" id="resetBtn">Reset</button></div>
    </header>
    <div class="scene" id="houseScene">
      <svg id="houseSvg" viewBox="0 0 390 420" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Isometric ground floor with four rooms: study, stairwell, entrance and living room"></svg>
      <svg class="nibb" id="houseNibb" style="left: 12px; top: 78px" viewBox="0 0 120 110" aria-hidden="true"></svg>
      <div class="bubble" id="houseBubble" style="left: 92px; top: 84px">This is your house! Tap it to go inside.</div>
    </div>
    <div class="card">
      <span class="eyebrow">Your items</span>
      <p id="houseSummary">7 items collected from lessons. Placed: 0.</p>
    </div>
  </section>

  <section class="view out" id="roomView" aria-label="Room">
    <header class="pad">
      <button class="chip" id="backBtn" aria-label="Back to the house"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>House</button>
      <div class="title" style="text-align: center; align-items: center"><b id="roomName">Study</b><span id="roomSub">Drag items onto glowing spots</span></div>
      <button class="chip go" id="doneBtn">Done</button>
    </header>
    <div class="scene" id="roomScene">
      <svg id="roomSvg" viewBox="0 0 390 452" preserveAspectRatio="xMidYMax meet" role="img" aria-label="The inside of the room, seen from an angle, with two walls and a tiled floor"></svg>
      <svg class="nibb" id="roomNibb" style="right: 10px; top: 4px" viewBox="0 0 120 110" aria-hidden="true"></svg>
      <div class="bubble" id="roomBubble" style="right: 86px; top: 10px">Pick an item below and drag it in.</div>
      <div class="toast" id="toast"></div>
      <div class="card-sheet" id="itemCard" role="dialog" aria-modal="false" aria-labelledby="icTitle" hidden>
        <div class="ic-head"><span class="ic-badge" id="icBadge">from Strings</span><button class="ic-x" id="icClose" aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>
        <b class="ic-title" id="icTitle">Bookshelf</b>
        <p class="ic-idea" id="icIdea"></p>
        <div class="ic-play" id="icPlay"></div>
        <pre class="ic-code" id="icCode" aria-live="polite"></pre>
        <div class="ic-actions"><button class="ic-btn try" id="icTry">Try it</button><button class="ic-btn" id="icMove">Move</button></div>
      </div>
    </div>
    <div class="tray">
      <div class="tray-head pad"><b>Your items</b><span id="trayTip">Tap a placed item to try it</span><button class="chip turn" id="turnBtn" hidden aria-label="Turn the item"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7"></path><path d="M20 4v5h-5"></path></svg>Turn</button></div>
      <div class="items pad" id="items"></div>
    </div>
  </section>

</div></div>

<script>
(function () {
  // ---------- data ----------
  var ROOMS = {
    study:    { name: 'Study',       rx: 0, ry: 0, rw: 5, rh: 5, floor: '#E8D9F2', floor2: '#DCCBEA', wallL: '#F2E4F4', wallR: '#E6D3EA' },
    stairs:   { name: 'Stairwell',   rx: 5, ry: 0, rw: 5, rh: 5, floor: '#E9C9A0', floor2: '#DFBB8F', wallL: '#F4E2CC', wallR: '#EAD3B6' },
    entrance: { name: 'Entrance',    rx: 0, ry: 5, rw: 4, rh: 5, floor: '#F1E3C8', floor2: '#E6D5B5', wallL: '#F6EBD8', wallR: '#EDDDC2' },
    living:   { name: 'Living room', rx: 4, ry: 5, rw: 6, rh: 5, floor: '#F6D7C3', floor2: '#EDC8B0', wallL: '#FAE6D8', wallR: '#F0D5C2' }
  };
  var ORDER = ['study', 'stairs', 'entrance', 'living'];
  // any item can go in any room: the only limits are free space, the window and the door
  var ITEMS = {
    bookshelf: { name: 'Bookshelf', from: 'Strings', kind: 'wall', size: 2, count: 1, rooms: null },
    desk:      { name: 'Desk', from: 'Variables', kind: 'floor', w: 2, d: 1, count: 1, rooms: null },
    lamp:      { name: 'Lamp', from: 'True / False', kind: 'floor', w: 1, d: 1, count: 2, tall: true, rooms: null },
    sofa:      { name: 'Sofa', from: 'Numbers', kind: 'floor', w: 2, d: 1, count: 1, rooms: null },
    rug:       { name: 'Rug', from: 'Welcome gift', kind: 'floor', w: 2, d: 2, flat: true, count: 1, rooms: null },
    plant:     { name: 'Plant', from: 'Bonus: Strings', kind: 'floor', w: 1, d: 1, count: 1, rooms: null },
    poster:    { name: 'Poster', from: 'Hello, Python', kind: 'wall', size: 1, count: 1, rooms: null },
    stairs:    { name: 'Stairs', locked: 'Loops' }
  };
  // ---------- what the lessons have earned ----------
  // The main app saves how many lessons are finished in 'cq-progress' (same site, so we can read it here).
  // Lesson i is finished when PROGRESS > i. Each lesson earns one kind of item.
  var PROGRESS = 0; // nothing saved yet = empty land
  try { var pr = JSON.parse(localStorage.getItem('cq-progress') || 'null'); if (pr && pr.v === 2 && typeof pr.current === 'number' && pr.current >= 0 && pr.current <= 9) PROGRESS = Math.floor(pr.current); } catch (e) {}
  var LESSON_NAMES = ['Hello, Python', 'Variables', 'Numbers', 'Strings', 'Input', 'True / False', 'Decisions', 'Loops', 'the Boss'];
  var NEED = { poster: 0, desk: 1, sofa: 2, bookshelf: 3, plant: 3, lamp: 5 }; // rug: a welcome gift, always earned
  Object.keys(NEED).forEach(function (id) { if (PROGRESS <= NEED[id]) ITEMS[id].locked = LESSON_NAMES[NEED[id]]; });
  var WALLS_UP = PROGRESS >= 3; // Hello lays the door, Variables the foundation, Numbers raises the walls
  var TRAY = ['bookshelf', 'desk', 'lamp', 'sofa', 'rug', 'plant', 'poster', 'stairs'];
  var GRID = 4;
  // long furniture (desk, sofa) can be turned: r = true swaps its width and depth
  function dims(id, r) { var it = ITEMS[id]; return r ? { w: it.d, d: it.w } : { w: it.w, d: it.d }; }
  function canTurn(id) { var it = ITEMS[id]; return it.kind === 'floor' && it.w !== it.d; }
  // openings in every room: the window on the right wall and the door on the left wall.
  // Wall slots they cover can't hold pictures or shelves, and the floor tile inside the door stays clear.
  var WINDOW = { side: 'R', from: 2.6, len: 1.1 }, DOOR = { side: 'L', from: 3.1, len: 0.85 };
  function slotBlocked(side, i) {
    return [WINDOW, DOOR].some(function (o) { return o.side === side && i < o.from + o.len && i + 1 > o.from; });
  }
  function cellBlocked(x, y) { return x === 0 && y === 3; } // just inside the door

  var state = { placed: { study: [], stairs: [], entrance: [], living: [] } };
  try { var loadUsed = {}, s = JSON.parse(localStorage.getItem('cq-iso') || 'null'); if (s && s.placed && typeof s.placed === 'object') ORDER.forEach(function (r) { if (Array.isArray(s.placed[r])) state.placed[r] = s.placed[r].reduce(function (keep, p) {
      // saved data is untrusted: accept only known items at whole-number positions, and keep only known fields
      if (!p || typeof p !== 'object' || typeof p.id !== 'string' || !Object.prototype.hasOwnProperty.call(ITEMS, p.id)) return keep;
      var it = ITEMS[p.id]; if (it.locked || !it.kind) return keep;
      var clean, spot, inGrid;
      if (it.kind === 'wall') {
        clean = { id: p.id, side: p.side, i: p.i }; spot = { side: p.side, i: p.i };
        inGrid = (p.side === 'L' || p.side === 'R') && Number.isInteger(p.i) && p.i >= 0 && p.i + it.size <= GRID;
      } else {
        var r = p.r === 1 || p.r === true;
        clean = { id: p.id, x: p.x, y: p.y }; if (r) clean.r = 1; if (p.id === 'lamp' && p.off === true) clean.off = true;
        spot = { x: p.x, y: p.y, r: r };
        inGrid = Number.isInteger(p.x) && Number.isInteger(p.y) && p.x >= 0 && p.y >= 0 && p.x + dims(p.id, r).w <= GRID && p.y + dims(p.id, r).d <= GRID;
      }
      if (inGrid && (loadUsed[p.id] || 0) < it.count && fits(keep, p.id, spot)) { keep.push(clean); loadUsed[p.id] = (loadUsed[p.id] || 0) + 1; }
      return keep;
    }, []); }); } catch (e) {}
  function save() { try { localStorage.setItem('cq-iso', JSON.stringify(state)); } catch (e) {} }
  function usedCount(id) { var n = 0; ORDER.forEach(function (r) { state.placed[r].forEach(function (p) { if (p.id === id) n++; }); }); return n; }

    closeCard();
    state.placed[current].splice(state.placed[current].indexOf(p), 1); save();
    startDrag({ clientX: 0, clientY: 0 }, p.id, true); // picked up: now tap a glowing spot to put it somewhere else
    if (drag) drag.keepOff = !!p.off; else { state.placed[current].push(p); save(); drawRoom(); } // nowhere free: put it back
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !document.getElementById('itemCard').hidden) closeCard(); });

  function toast(t) { var el = document.getElementById('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(el._t); el._t = setTimeout(function () { el.classList.remove('on'); }, 1800); }

  // ---------- drag and drop ----------
  function svgPoint(evt) {
    var svg = document.getElementById('roomSvg'), pt = svg.createSVGPoint();
    pt.x = evt.clientX; pt.y = evt.clientY;
    var m = svg.getScreenCTM(); if (!m) return null;
    return pt.matrixTransform(m.inverse());
  }
  function inPoly(pt, poly) {
    var inside = false;
    for (var i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      var xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
      if (((yi > pt.y) !== (yj > pt.y)) && (pt.x < (xj - xi) * (pt.y - yi) / (yj - yi) + xi)) inside = !inside;
    }
    return inside;
  }
  function overTray(evt) { var r = document.querySelector('.tray').getBoundingClientRect(); return evt.clientY >= r.top; }
  // only a spot your finger is actually on counts (no snapping to the nearest one)
  // forgiving: a fingertip that lands just outside a spot's edge (within a few px) still counts as a tap
  // on it, but only when it is clearly the nearest spot. Drags stay exact so nothing snaps by accident.
  function edgeDist(p, poly) {
    var best = Infinity;
    for (var i = 0; i < poly.length; i++) {
      var a = poly[i], b = poly[(i + 1) % poly.length], dx = b[0] - a[0], dy = b[1] - a[1];
      var t = Math.max(0, Math.min(1, ((p.x - a[0]) * dx + (p.y - a[1]) * dy) / (dx * dx + dy * dy || 1)));
      best = Math.min(best, Math.hypot(p.x - a[0] - t * dx, p.y - a[1] - t * dy));
    }
    return best;
  }
  function spotAt(evt, forgiving) {
    if (!drag || overTray(evt)) return null;
    var p = svgPoint(evt); if (!p) return null;
    for (var k = 0; k < drag.spots.length; k++) if (inPoly(p, spotShape(drag.spots[k], drag.id))) return drag.spots[k];
    if (!forgiving) return null;
    var near = null, nd = 16;
    drag.spots.forEach(function (sp) { var d = edgeDist(p, spotShape(sp, drag.id)); if (d < nd) { nd = d; near = sp; } });
    return near;
  }
  // Swipe sideways scrolls the tray; pulling an item upward (or a mouse drag) picks it up.
  var pending = null;
  document.getElementById('items').addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var el = e.target.closest('.item'); if (!el) return;
    e.preventDefault();
    var id = el.getAttribute('data-id'), it = ITEMS[id];
    if (it.locked) { say(document.getElementById('roomBubble'), 'The ' + it.name.toLowerCase() + ' unlocks when you finish the ' + it.locked + ' lesson.', false, document.getElementById('roomNibb')); return; }
    if (drag && drag.mode === 'tap' && drag.id === id) { cancelPlacing('Okay, put it back.'); return; }
    if (it.count - usedCount(id) <= 0) { say(document.getElementById('roomBubble'), 'You have placed every ' + it.name.toLowerCase() + '. Choose one in the room to move it.', false, document.getElementById('roomNibb')); return; }
    startDrag({ clientX: 0, clientY: 0 }, id, true);
    var first = document.querySelector('#roomSvg .spot'); if (first) first.focus();
  });
  document.getElementById('items').addEventListener('pointerdown', function (e) {
    var el = e.target.closest('.item'); if (!el) return;
    var id = el.getAttribute('data-id'), it = ITEMS[id];
    if (it.locked) { say(document.getElementById('roomBubble'), 'The ' + it.name.toLowerCase() + ' unlocks when you finish the ' + it.locked + ' lesson.', false, document.getElementById('roomNibb')); return; }
    if (it.count - usedCount(id) <= 0) { say(document.getElementById('roomBubble'), 'You have placed every ' + it.name.toLowerCase() + '. Tap one to pick it up.', false, document.getElementById('roomNibb')); return; }
    pending = { id: id, x: e.clientX, y: e.clientY, mouse: e.pointerType === 'mouse' };
    if (pending.mouse) e.preventDefault();
  });
  function startDrag(e, id, tapMode) {
    closeCard();
    var it = ITEMS[id];
    var allowed = !it.rooms || it.rooms.indexOf(current) >= 0;
    if (drag && drag.ghost) drag.ghost.remove();
    drag = { id: id, mode: tapMode ? 'tap' : 'drag', allowed: allowed, rot: false, spots: allowed ? validSpots(current, id, false) : [], hover: null, ghost: null };
    var turned = false;
    if (allowed && !drag.spots.length && canTurn(id)) { var alt = validSpots(current, id, true); if (alt.length) { drag.rot = true; drag.spots = alt; turned = true; } }
    if (!tapMode) { drag.ghost = document.createElement('div'); drag.ghost.className = 'ghost'; drag.ghost.innerHTML = trayIcon(id); document.body.appendChild(drag.ghost); moveGhost(e); }
    renderTray();
    if (!allowed) say(document.getElementById('roomBubble'), it.hint || 'That does not fit in this room.', false, document.getElementById('roomNibb'));
    else if (!drag.spots.length) { if (drag.ghost) drag.ghost.remove(); drag = null; renderTray(); say(document.getElementById('roomBubble'), noSpaceMsg(id), false, document.getElementById('roomNibb')); drawRoom(); return; }
    else if (turned) say(document.getElementById('roomBubble'), 'I turned the ' + it.name.toLowerCase() + ' sideways so it fits. Tap Turn to switch.', false, document.getElementById('roomNibb'));
    else say(document.getElementById('roomBubble'), tapMode ? 'Now tap a glowing spot to place it. Tap the item again to cancel.' : (it.kind === 'wall' ? 'Wall item! Slide it onto a glowing wall spot.' : 'Floor item! Drop it on a glowing spot.'), false, document.getElementById('roomNibb'));
    drawRoom();
  }
  function noSpaceMsg(id) {
    var it = ITEMS[id];
    if (it.kind === 'wall') return 'Both walls are full where the ' + it.name.toLowerCase() + ' would go (the window and door need space too). Tap a wall item to pick it up.';
    var dm = dims(id, false);
    return 'No free spot for the ' + it.name.toLowerCase() + '. It needs ' + (dm.w * dm.d === 1 ? 'one empty tile' : dm.w + ' × ' + dm.d + ' empty tiles') + '. Tap something in the room to pick it up.';
  }
  function turnItem() {
    if (!drag || !canTurn(drag.id)) return;
    var next = validSpots(current, drag.id, !drag.rot);
    if (!next.length) { say(document.getElementById('roomBubble'), 'It won\'t fit turned that way here.', false, document.getElementById('roomNibb')); return; }
    drag.rot = !drag.rot; drag.spots = next; drag.hover = null; drawRoom();
    say(document.getElementById('roomBubble'), 'Turned! Now tap a glowing spot.', false, document.getElementById('roomNibb'));
  }
  document.getElementById('turnBtn').addEventListener('click', function (e) { e.stopPropagation(); turnItem(); });
  function moveGhost(e) { if (drag && drag.ghost) { drag.ghost.style.left = e.clientX + 'px'; drag.ghost.style.top = e.clientY + 'px'; } }
  window.addEventListener('pointermove', function (e) {
    if (pending && !drag) {
      var dy = pending.y - e.clientY, dx = Math.abs(e.clientX - pending.x);
      if (dy > 10 && dy > dx || (pending.mouse && Math.hypot(dx, dy) > 6)) { var id = pending.id; pending = null; startDrag(e, id); }
      else if (dx > 14) pending = null;
    }
    if (!drag || drag.mode !== 'drag') return;
    e.preventDefault();
    moveGhost(e);
    if (!drag.allowed) return;
    var h = spotAt(e);
    if ((h && (!drag.hover || !sameSpot(h, drag.hover))) || (!h && drag.hover)) { drag.hover = h; drawRoom(); }
  });
  function place(d, spot) {
    var it = ITEMS[d.id];
    var np = it.kind === 'wall' ? { id: d.id, side: spot.side, i: spot.i } : (spot.r ? { id: d.id, x: spot.x, y: spot.y, r: 1 } : { id: d.id, x: spot.x, y: spot.y });
    if (d.keepOff) np.off = true;
    state.placed[current].push(np);
    save();
    say(document.getElementById('roomBubble'), ['Perfect spot!', 'Looks great in here.', 'Nice! Your room is coming alive.'][state.placed[current].length % 3], true, document.getElementById('roomNibb'));
  }
  function cancelPlacing(msg) {
    if (drag && drag.ghost) drag.ghost.remove();
    drag = null; drawRoom(); renderTray();
    if (msg) say(document.getElementById('roomBubble'), msg, false, document.getElementById('roomNibb'));
  }
  function endDrag(e) {
    if (pending) {
      // a tap on a tray item (no drag): select it, or unselect if it was already selected
      var id = pending.id; pending = null;
      if (drag && drag.mode === 'tap' && drag.id === id) { cancelPlacing('Okay, put it back.'); return; }
      startDrag(e, id, true); return;
    }
    if (!drag || drag.mode !== 'drag') return;
    var d = drag; drag = null; if (d.ghost) d.ghost.remove();
    var spot = d.allowed && !overTray(e) ? d.hover : null;
    if (spot) place(d, spot);
    else if (d.allowed && d.spots.length) say(document.getElementById('roomBubble'), 'Not placed. Let go on a glowing spot, or tap the item and then tap a spot.', false, document.getElementById('roomNibb'));
    drawRoom(); renderTray();
  }
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', function () { pending = null; if (drag && drag.mode === 'drag') cancelPlacing(); });

  // ---------- start ----------
  document.getElementById('houseNibb').innerHTML = nibb(false);
  document.getElementById('roomNibb').innerHTML = nibb(false);
  drawHouse();
  // ---------- build moment: the app opens this page with ?build=<lesson> right after a lesson ----------
  var BUILT = {
    0: 'Your front door is up! print() says Hello to everyone who visits.',
    1: 'The foundation is poured! Everything stands on it, just like your programs stand on variables.',
    2: 'The walls are up! Tap the house to go inside and place your items.',
    3: 'You earned a bookshelf! Tap the house, open a room and place it.',
    4: 'A mailbox! Messages from outside arrive here, like input().',
    5: 'Two lamps! Place them, then tap one to switch it on and off.'
  };
  function playBuild(n) {
    var bubble = document.getElementById('houseBubble'), nb = document.getElementById('houseNibb');
    var part = document.querySelector('#houseSvg [data-part="' + n + '"]');
    if (part && !still) {
      part.classList.add(n === 2 ? 'build-rise' : 'build-drop');
      setTimeout(function () { // dust where it lands
        var bb = part.getBBox(), g = document.createElementNS('http://www.w3.org/2000/svg', 'g'), y = bb.y + bb.height;
        for (var k = 0; k < 6; k++) {
          var c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          c.setAttribute('cx', bb.x + bb.width * (0.1 + k * 0.16)); c.setAttribute('cy', y - 4); c.setAttribute('r', 7 + (k % 3) * 2);
          c.setAttribute('fill', '#F3E6D6'); c.setAttribute('class', 'puff');
          c.style.setProperty('--dx', ((k - 2.5) * 6) + 'px'); c.style.animationDelay = (k * 0.04) + 's';
          g.appendChild(c);
        }
        document.getElementById('houseSvg').appendChild(g);
        setTimeout(function () { g.remove(); }, 1400);
      }, n === 2 ? 1500 : 1150);
    }
    say(bubble, 'Watch this...', false, nb);
    setTimeout(function () { say(bubble, BUILT[n] || 'Lesson done! Look what you built.', true, nb); }, still ? 0 : 1500);
    var got = TRAY.filter(function (id) { return NEED[id] === n; }).map(function (id) { return ITEMS[id].name.toLowerCase(); });
    if (got.length) setTimeout(function () {
      say(bubble, 'New in your tray: ' + got.join(' and ') + '.' + (WALLS_UP ? ' Go inside to place ' + (got.length > 1 ? 'them' : 'it') + '!' : ' It waits until the walls are up.'), true, nb);
    }, still ? 2500 : 5200);
  }
  var buildArg = /[?&]build=(\d)\b/.exec(location.search);
  var BUILD_NOW = buildArg ? +buildArg[1] : -1;
  if (BUILD_NOW >= 0 && BUILD_NOW === PROGRESS - 1) playBuild(BUILD_NOW);
  else if (!WALLS_UP) say(document.getElementById('houseBubble'), 'Empty land, for now! Every lesson you finish builds part of your house.', false, document.getElementById('houseNibb'));
})();
</script>

</html>
